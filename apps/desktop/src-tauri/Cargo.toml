[package]
name = "agentui-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
security-framework = "=3.7.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
core-foundation = "=0.10.1"
uuid = { version = "=1.29.2", features = ["v4"] }

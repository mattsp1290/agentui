name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux package verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify pinned toolchain
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            assert.equal(process.versions.node, readFileSync(".node-version", "utf8").trim());
            assert.equal(execFileSync("npm", ["--version"], { encoding: "utf8" }).trim(), pkg.packageManager.slice(4));
          '
      - run: npm ci
      - run: npm run verify
